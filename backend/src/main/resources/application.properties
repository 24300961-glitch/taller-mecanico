spring.application.name=taller-mecanico
server.port=8080

# === BASE DE DATOS: H2 local por defecto, MySQL via Docker si DB_URL existe ===
spring.datasource.url=${DB_URL:jdbc:h2:mem:taller_mecanico;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.flyway.enabled=${DB_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${DB_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# === CONSOLA H2 (accesible en /h2-console) ===
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# === THYMELEAF ===
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# === MAIL ===
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# === APP ===
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.nombre=${APP_ADMIN_NOMBRE:Administrador de taller}

# === TALLERES Y VEHÍCULOS ===
app.talleres.storage=${TALLERES_STORAGE:storage/talleres}
app.vehiculos.storage=${VEHICULOS_STORAGE:storage/vehiculos}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
app.sepomex.archivo=${SEPOMEX_FILE:}
app.sepomex.importar=${SEPOMEX_IMPORTAR:false}

# === SEGURIDAD: roles iniciales y sus permisos (configurables, se guardan en BD) ===
app.seguridad.actor-sistema=Sistema
app.seguridad.rol-registro-publico=Cliente
app.seguridad.rol-administrador-inicial=Administrador de taller

app.seguridad.roles-iniciales[0].nombre=Administrador de taller
app.seguridad.roles-iniciales[0].permisos=USUARIOS_CONSULTAR,ROLES_CREAR,ROLES_ASIGNAR,CLIENTES_CONSULTAR,CLIENTES_REGISTRAR,CLIENTES_EDITAR,CLIENTES_DESACTIVAR,VEHICULOS_CONSULTAR,VEHICULOS_REGISTRAR,VEHICULOS_EDITAR,VEHICULOS_DESACTIVAR
app.seguridad.roles-iniciales[1].nombre=Recepcionista
app.seguridad.roles-iniciales[1].permisos=USUARIOS_CONSULTAR,CLIENTES_CONSULTAR,CLIENTES_REGISTRAR,CLIENTES_EDITAR,CLIENTES_DESACTIVAR,VEHICULOS_CONSULTAR,VEHICULOS_REGISTRAR
app.seguridad.roles-iniciales[2].nombre=Cliente
app.seguridad.roles-iniciales[3].nombre=Maestro Mec\u00e1nico
app.seguridad.roles-iniciales[3].permisos=CLIENTES_CONSULTAR,CLIENTES_EDITAR,VEHICULOS_CONSULTAR,VEHICULOS_EDITAR,VEHICULOS_DESACTIVAR
app.seguridad.roles-iniciales[4].nombre=Asesor de servicio
app.seguridad.roles-iniciales[4].permisos=CLIENTES_CONSULTAR,CLIENTES_EDITAR,VEHICULOS_CONSULTAR,VEHICULOS_EDITAR
app.seguridad.roles-iniciales[5].nombre=T\u00e9cnico de consulta
app.seguridad.roles-iniciales[5].permisos=CLIENTES_CONSULTAR,VEHICULOS_CONSULTAR
app.seguridad.roles-iniciales[6].nombre=Sistema
app.seguridad.roles-iniciales[6].asignable=false
app.seguridad.roles-iniciales[7].nombre=Jefe de operaciones
app.seguridad.roles-iniciales[7].permisos=

# Equivalencias para migrar usuarios de la columna heredada users.role
app.seguridad.equivalencias-legado.ADMIN_TALLER=Administrador de taller
app.seguridad.equivalencias-legado.ADMINISTRADOR=Administrador de taller
app.seguridad.equivalencias-legado.RECEPCIONISTA=Recepcionista
app.seguridad.equivalencias-legado.ASESOR_SERVICIO=Asesor de servicio
app.seguridad.equivalencias-legado.TECNICO_CONSULTA=T\u00e9cnico de consulta
app.seguridad.equivalencias-legado.MAESTRO_MECANICO=Maestro Mec\u00e1nico
app.seguridad.equivalencias-legado.CLIENTE=Cliente
app.seguridad.equivalencias-legado.SISTEMA=Sistema
app.seguridad.equivalencias-legado.JEFE_DE_OPERACIONES=Jefe de operaciones

# === LOGGING ===
logging.file.name=logs/taller-mecanico.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.level.root=INFO
logging.level.mx.tallermecanico=DEBUG
logging.level.org.springframework.security=INFO
